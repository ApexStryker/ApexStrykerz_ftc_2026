<svg xmlns='http://www.w3.org/2000/svg' width='960' height='360' viewBox='0 0 960 360'><rect x='1' y='1' width='958' height='358' rx='18' fill='#FFFDF7' stroke='#E5E0D8' stroke-width='2'/><text x='480.0' y='42' font-size='26' fill='#1A1611' text-anchor='middle' font-weight='bold' font-family='Arial, Helvetica, sans-serif' >What the program does, over and over</text><rect x='30' y='100' width='135' height='110' rx='12' fill='white' stroke='#9CA3AF' stroke-width='3' /><text x='97.5' y='130' font-size='17' fill='#9CA3AF' text-anchor='middle' font-weight='bold' font-family='Arial, Helvetica, sans-serif' >INIT</text><text x='97.5' y='160' font-size='13' fill='#1A1611' text-anchor='middle' font-weight='normal' font-family='Arial, Helvetica, sans-serif' >Find the 4 motors</text><text x='97.5' y='178' font-size='13' fill='#1A1611' text-anchor='middle' font-weight='normal' font-family='Arial, Helvetica, sans-serif' >by their names</text><line x1='167' y1='155' x2='175.8' y2='155.0' stroke='#1A1611' stroke-width='3' stroke-linecap='round' /><polygon points='183.0,155.0 175.1,159.3 175.1,150.7' fill='#1A1611'/><rect x='185' y='100' width='135' height='110' rx='12' fill='white' stroke='#9CA3AF' stroke-width='3' /><text x='252.5' y='130' font-size='17' fill='#9CA3AF' text-anchor='middle' font-weight='bold' font-family='Arial, Helvetica, sans-serif' >START</text><text x='252.5' y='160' font-size='13' fill='#1A1611' text-anchor='middle' font-weight='normal' font-family='Arial, Helvetica, sans-serif' >Driver presses</text><text x='252.5' y='178' font-size='13' fill='#1A1611' text-anchor='middle' font-weight='normal' font-family='Arial, Helvetica, sans-serif' >START</text><line x1='322' y1='155' x2='330.8' y2='155.0' stroke='#1A1611' stroke-width='3' stroke-linecap='round' /><polygon points='338.0,155.0 330.1,159.3 330.1,150.7' fill='#1A1611'/><rect x='340' y='100' width='135' height='110' rx='12' fill='white' stroke='#FF8A3D' stroke-width='3' /><text x='407.5' y='130' font-size='17' fill='#FF8A3D' text-anchor='middle' font-weight='bold' font-family='Arial, Helvetica, sans-serif' >1. Read</text><text x='407.5' y='160' font-size='13' fill='#1A1611' text-anchor='middle' font-weight='normal' font-family='Arial, Helvetica, sans-serif' >left stick,</text><text x='407.5' y='178' font-size='13' fill='#1A1611' text-anchor='middle' font-weight='normal' font-family='Arial, Helvetica, sans-serif' >right stick</text><line x1='477' y1='155' x2='485.8' y2='155.0' stroke='#1A1611' stroke-width='3' stroke-linecap='round' /><polygon points='493.0,155.0 485.1,159.3 485.1,150.7' fill='#1A1611'/><rect x='495' y='100' width='135' height='110' rx='12' fill='white' stroke='#3B82F6' stroke-width='3' /><text x='562.5' y='130' font-size='17' fill='#3B82F6' text-anchor='middle' font-weight='bold' font-family='Arial, Helvetica, sans-serif' >2. Math</text><text x='562.5' y='160' font-size='13' fill='#1A1611' text-anchor='middle' font-weight='normal' font-family='Arial, Helvetica, sans-serif' >mix into 4 wheel</text><text x='562.5' y='178' font-size='13' fill='#1A1611' text-anchor='middle' font-weight='normal' font-family='Arial, Helvetica, sans-serif' >powers</text><line x1='632' y1='155' x2='640.8' y2='155.0' stroke='#1A1611' stroke-width='3' stroke-linecap='round' /><polygon points='648.0,155.0 640.1,159.3 640.1,150.7' fill='#1A1611'/><rect x='650' y='100' width='135' height='110' rx='12' fill='white' stroke='#22C55E' stroke-width='3' /><text x='717.5' y='130' font-size='17' fill='#22C55E' text-anchor='middle' font-weight='bold' font-family='Arial, Helvetica, sans-serif' >3. Power</text><text x='717.5' y='160' font-size='13' fill='#1A1611' text-anchor='middle' font-weight='normal' font-family='Arial, Helvetica, sans-serif' >send powers</text><text x='717.5' y='178' font-size='13' fill='#1A1611' text-anchor='middle' font-weight='normal' font-family='Arial, Helvetica, sans-serif' >to the motors</text><line x1='787' y1='155' x2='795.8' y2='155.0' stroke='#1A1611' stroke-width='3' stroke-linecap='round' /><polygon points='803.0,155.0 795.1,159.3 795.1,150.7' fill='#1A1611'/><rect x='805' y='100' width='135' height='110' rx='12' fill='white' stroke='#8B5CF6' stroke-width='3' /><text x='872.5' y='130' font-size='17' fill='#8B5CF6' text-anchor='middle' font-weight='bold' font-family='Arial, Helvetica, sans-serif' >4. Show</text><text x='872.5' y='160' font-size='13' fill='#1A1611' text-anchor='middle' font-weight='normal' font-family='Arial, Helvetica, sans-serif' >numbers on the</text><text x='872.5' y='178' font-size='13' fill='#1A1611' text-anchor='middle' font-weight='normal' font-family='Arial, Helvetica, sans-serif' >Driver Station</text><path d='M872.5,212 L872.5,250 L407.5,250 L407.5,214' fill='none' stroke='#FF8A3D' stroke-width='4' stroke-linecap='round' stroke-linejoin='round' /><line x1='407.5' y1='224' x2='407.5' y2='221.6' stroke='#FF8A3D' stroke-width='4' stroke-linecap='round' /><polygon points='407.5,212.0 413.3,222.5 401.7,222.5' fill='#FF8A3D'/><text x='640.0' y='272' font-size='14' fill='#FF8A3D' text-anchor='middle' font-weight='bold' font-family='Arial, Helvetica, sans-serif' >repeat about 50 times every second, until the driver presses STOP</text><rect x='30' y='295' width='900' height='46' rx='10' fill='#F3EFE7' stroke='none' stroke-width='0' /><text x='480' y='323' font-size='14' fill='#1A1611' text-anchor='middle' font-weight='normal' font-family='Arial, Helvetica, sans-serif' >This is called a LOOP. Because it repeats so fast, the robot reacts the instant you move the stick.</text></svg>