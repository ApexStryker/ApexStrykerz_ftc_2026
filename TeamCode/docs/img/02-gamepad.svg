0' r='8.0' fill='#8a8378' stroke='none' stroke-width='2'/><rect x='40' y='90' width='250' height='150' rx='12' fill='white' stroke='#FF8A3D' stroke-width='3' /><text x='165' y='118' font-size='18' fill='#FF8A3D' text-anchor='middle' font-weight='bold' font-family='Arial, Helvetica, sans-serif' >LEFT stick</text><text x='55' y='148.0' font-size='14' fill='#1A1611' text-anchor='start' font-weight='normal' font-family='Arial, Helvetica, sans-serif' >Push UP  -&gt;  drive forward</text><text x='55' y='166.9' font-size='14' fill='#1A1611' text-anchor='start' font-weight='normal' font-family='Arial, Helvetica, sans-serif' >Push DOWN  -&gt;  drive backward</text><text x='55' y='185.8' font-size='14' fill='#1A1611' text-anchor='start' font-weight='normal' font-family='Arial, Helvetica, sans-serif' >Push LEFT  -&gt;  slide (strafe) left</text><text x='55' y='204.7' font-size='14' fill='#1A1611' text-anchor='start' font-weight='normal' font-family='Arial, Helvetica, sans-serif' >Push RIGHT  -&gt;  slide (strafe) right</text><line x1='290' y1='165' x2='366.0967939278286' y2='234.60072615350182' stroke='#FF8A3D' stroke-width='3' stroke-linecap='round' /><polygon points='372.0,240.0 362.3,237.6 368.8,230.5' fill='#FF8A3D'/><rect x='610' y='90' width='250' height='120' rx='12' fill='white' stroke='#3B82F6' stroke-width='3' /><text x='735' y='118' font-size='18' fill='#3B82F6' text-anchor='middle' font-weight='bold' font-family='Arial, Helvetica, sans-serif' >RIGHT stick</text><text x='625' y='148.0' font-size='14' fill='#1A1611' text-anchor='start' font-weight='normal' font-family='Arial, Helvetica, sans-serif' >Push LEFT  -&gt;  spin left</text><text x='625' y='166.9' font-size='14' fill='#1A1611' text-anchor='start' font-weight='normal' font-family='Arial, Helvetica, sans-serif' >Push RIGHT  -&gt;  spin right</text><text x='625' y='185.8' font-size='14' fill='#1A1611' text-anchor='start' font-weight='normal' font-family='Arial, Helvetica, sans-serif' >Up / down does nothing</text><line x1='610' y1='165' x2='526.145770236779' y2='234.87852480268415' stroke='#3B82F6' stroke-width='3' stroke-linecap='round' /><polygon points='520.0,240.0 523.7,230.7 529.8,238.1' fill='#3B82F6'/><rect x='120' y='385' width='660' height='60' rx='10' fill='#F3EFE7' stroke='none' stroke-width='0' /><text x='450' y='410.0' font-size='14' fill='#1A1611' text-anchor='middle' font-weight='normal' font-family='Arial, Helvetica, sans-serif' >You can do all three at once! Push the left stick forward AND right</text><text x='450' y='428.9' font-size='14' fill='#1A1611' text-anchor='middle' font-weight='normal' font-family='Arial, Helvetica, sans-serif' >while turning with the right stick. The program mixes them together.</text></svg>