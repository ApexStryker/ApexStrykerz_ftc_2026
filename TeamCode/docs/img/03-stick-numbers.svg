<svg xmlns='http://www.w3.org/2000/svg' width='900' height='440' viewBox='0 0 900 440'><rect x='1' y='1' width='898' height='438' rx='18' fill='#FFFDF7' stroke='#E5E0D8' stroke-width='2'/><text x='450.0' y='42' font-size='26' fill='#1A1611' text-anchor='middle' font-weight='bold' font-family='Arial, Helvetica, sans-serif' >A joystick is a number machine</text><rect x='80' y='110' width='140' height='140' rx='10' fill='white' stroke='#1A1611' stroke-width='2' /><line x1='80' y1='180' x2='220' y2='180' stroke='#9CA3AF' stroke-width='1.5' stroke-linecap='round' stroke-dasharray='4 4'/><line x1='150' y1='110' x2='150' y2='250' stroke='#9CA3AF' stroke-width='1.5' stroke-linecap='round' stroke-dasharray='4 4'/><circle cx='150' cy='180' r='22' fill='#3a352e' stroke='none' stroke-width='2'/><circle cx='150' cy='180' r='16' fill='#6b6459' stroke='#1A1611' stroke-width='2'/><circle cx='150' cy='180' r='6' fill='#8a8378' stroke='none' stroke-width='2'/><text x='150' y='280' font-size='15' fill='#1A1611' text-anchor='middle' font-weight='bold' font-family='Arial, Helvetica, sans-serif' >Stick in the middle</text><text x='150' y='302' font-size='13' fill='#FF8A3D' text-anchor='middle' font-weight='bold' font-family='Arial, Helvetica, sans-serif' >left_stick_x = 0.0</text><text x='150' y='320' font-size='13' fill='#3B82F6' text-anchor='middle' font-weight='bold' font-family='Arial, Helvetica, sans-serif' >left_stick_y = 0.0</text><rect x='330' y='110' width='140' height='140' rx='10' fill='white' stroke='#1A1611' stroke-width='2' /><line x1='330' y1='180' x2='470' y2='180' stroke='#9CA3AF' stroke-width='1.5' stroke-linecap='round' stroke-dasharray='4 4'/><line x1='400' y1='110' x2='400' y2='250' stroke='#9CA3AF' stroke-width='1.5' stroke-linecap='round' stroke-dasharray='4 4'/><circle cx='400' cy='180' r='22' fill='#3a352e' stroke='none' stroke-width='2'/><circle cx='400' cy='135' r='16' fill='#6b6459' stroke='#1A1611' stroke-width='2'/><circle cx='400' cy='135' r='6' fill='#8a8378' stroke='none' stroke-width='2'/><text x='400' y='280' font-size='15' fill='#1A1611' text-anchor='middle' font-weight='bold' font-family='Arial, Helvetica, sans-serif' >Pushed all the way UP</text><text x='400' y='302' font-size='13' fill='#FF8A3D' text-anchor='middle' font-weight='bold' font-family='Arial, Helvetica, sans-serif' >left_stick_x = 0.0</text><text x='400' y='320' font-size='13' fill='#3B82F6' text-anchor='middle' font-weight='bold' font-family='Arial, Helvetica, sans-serif' >left_stick_y = -1.0</text><rect x='580' y='110' width='140' height='140' rx='10' fill='white' stroke='#1A1611' stroke-width='2' /><line x1='580' y1='180' x2='720' y2='180' stroke='#9CA3AF' stroke-width='1.5' stroke-linecap='round' stroke-dasharray='4 4'/><line x1='650' y1='110' x2='650' y2='250' stroke='#9CA3AF' stroke-width='1.5' stroke-linecap='round' stroke-dasharray='4 4'/><circle cx='650' cy='180' r='22' fill='#3a352e' stroke='none' stroke-width='2'/><circle cx='677.0' cy='180' r='16' fill='#6b6459' stroke='#1A1611' stroke-width='2'/><circle cx='677.0' cy='180' r='6' fill='#8a8378' stroke='none' stroke-width='2'/><text x='650' y='280' font-size='15' fill='#1A1611' text-anchor='middle' font-weight='bold' font-family='Arial, Helvetica, sans-serif' >Pushed a bit RIGHT</text><text x='650' y='302' font-size='13' fill='#FF8A3D' text-anchor='middle' font-weight='bold' font-family='Arial, Helvetica, sans-serif' >left_stick_x = 0.6</text><text x='650' y='320' font-size='13' fill='#3B82F6' text-anchor='middle' font-weight='bold' font-family='Arial, Helvetica, sans-serif' >left_stick_y = 0.0</text><rect x='30' y='355' width='840' height='70' rx='10' fill='#FFF1E6' stroke='#FF8A3D' stroke-width='2' /><text x='450' y='380.0' font-size='14' fill='#1A1611' text-anchor='middle' font-weight='normal' font-family='Arial, Helvetica, sans-serif' >Surprise! Pushing UP gives a NEGATIVE number. That's just how gamepads work.</text><text x='450' y='398.9' font-size='14' fill='#1A1611' text-anchor='middle' font-weight='normal' font-family='Arial, Helvetica, sans-serif' >So the program flips it:   drive = -gamepad1.left_stick_y   (now UP means +1 = forward)</text></svg>