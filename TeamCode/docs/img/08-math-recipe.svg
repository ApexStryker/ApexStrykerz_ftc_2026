<svg xmlns='http://www.w3.org/2000/svg' width='960' height='460' viewBox='0 0 960 460'><rect x='1' y='1' width='958' height='458' rx='18' fill='#FFFDF7' stroke='#E5E0D8' stroke-width='2'/><text x='480.0' y='42' font-size='26' fill='#1A1611' text-anchor='middle' font-weight='bold' font-family='Arial, Helvetica, sans-serif' >The recipe: mixing three numbers into four wheel powers</text><text x='30' y='90' font-size='16' fill='#1A1611' text-anchor='start' font-weight='bold' font-family='Arial, Helvetica, sans-serif' >Three ingredients from the sticks:</text><rect x='30' y='100' width='60.599999999999994' height='26' rx='13.0' fill='#FF8A3D' stroke='none' stroke-width='0' /><text x='60.3' y='117' font-size='14' fill='white' text-anchor='middle' font-weight='bold' font-family='Arial, Helvetica, sans-serif' >drive</text><rect x='120' y='100' width='68.72' height='26' rx='13.0' fill='#3B82F6' stroke='none' stroke-width='0' /><text x='154.36' y='117' font-size='14' fill='white' text-anchor='middle' font-weight='bold' font-family='Arial, Helvetica, sans-serif' >strafe</text><rect x='215' y='100' width='52.48' height='26' rx='13.0' fill='#22C55E' stroke='none' stroke-width='0' /><text x='241.24' y='117' font-size='14' fill='white' text-anchor='middle' font-weight='bold' font-family='Arial, Helvetica, sans-serif' >turn</text><text x='320' y='119' font-size='14' fill='#9CA3AF' text-anchor='start' font-weight='normal' font-family='Arial, Helvetica, sans-serif' >each one is a number from -1.0 to +1.0</text><rect x='30' y='138' width='520' height='36' rx='8' fill='white' stroke='#E5E0D8' stroke-width='1.5' /><text x='40' y='164' font-size='15' fill='#1A1611' text-anchor='start' font-weight='bold' font-family='Arial, Helvetica, sans-serif' >front_left</text><text x='150' y='164' font-size='15' fill='#1A1611' text-anchor='start' font-weight='normal' font-family='Arial, Helvetica, sans-serif' >=</text><rect x='170' y='146' width='57.699999999999996' height='25' rx='12.5' fill='#FF8A3D' stroke='none' stroke-width='0' /><text x='198.85' y='162' font-size='13' fill='white' text-anchor='middle' font-weight='bold' font-family='Arial, Helvetica, sans-serif' >drive</text><text x='240' y='164' font-size='18' fill='#1A1611' text-anchor='middle' font-weight='bold' font-family='Arial, Helvetica, sans-serif' >+</text><rect x='255' y='146' width='65.24' height='25' rx='12.5' fill='#3B82F6' stroke='none' stroke-width='0' /><text x='287.62' y='162' font-size='13' fill='white' text-anchor='middle' font-weight='bold' font-family='Arial, Helvetica, sans-serif' >strafe</text><text x='335' y='164' font-size='18' fill='#1A1611' text-anchor='middle' font-weight='bold' font-family='Arial, Helvetica, sans-serif' >+</text><rect x='350' y='146' width='50.16' height='25' rx='12.5' fill='#22C55E' stroke='none' stroke-width='0' /><text x='375.08' y='162' font-size='13' fill='white' text-anchor='middle' font-weight='bold' font-family='Arial, Helvetica, sans-serif' >turn</text><rect x='30' y='184' width='520' height='36' rx='8' fill='white' stroke='#E5E0D8' stroke-width='1.5' /><text x='40' y='210' font-size='15' fill='#1A1611' text-anchor='start' font-weight='bold' font-family='Arial, Helvetica, sans-serif' >front_right</text><text x='150' y='210' font-size='15' fill='#1A1611' text-anchor='start' font-weight='normal' font-family='Arial, Helvetica, sans-serif' >=</text><rect x='170' y='192' width='57.699999999999996' height='25' rx='12.5' fill='#FF8A3D' stroke='none' stroke-width='0' /><text x='198.85' y='208' font-size='13' fill='white' text-anchor='middle' font-weight='bold' font-family='Arial, Helvetica, sans-serif' >drive</text><text x='240' y='210' font-size='18' fill='#1A1611' text-anchor='middle' font-weight='bold' font-family='Arial, Helvetica, sans-serif' >-</text><rect x='255' y='192' width='65.24' height='25' rx='12.5' fill='#3B82F6' stroke='none' stroke-width='0' /><text x='287.62' y='208' font-size='13' fill='white' text-anchor='middle' font-weight='bold' font-family='Arial, Helvetica, sans-serif' >strafe</text><text x='335' y='210' font-size='18' fill='#1A1611' text-anchor='middle' font-weight='bold' font-family='Arial, Helvetica, sans-serif' >-</text><rect x='350' y='192' width='50.16' height='25' rx='12.5' fill='#22C55E' stroke='none' stroke-width='0' /><text x='375.08' y='208' font-size='13' fill='white' text-anchor='middle' font-weight='bold' font-family='Arial, Helvetica, sans-serif' >turn</text><rect x='30' y='230' width='520' height='36' rx='8' fill='white' stroke='#E5E0D8' stroke-width='1.5' /><text x='40' y='256' font-size='15' fill='#1A1611' text-anchor='start' font-weight='bold' font-family='Arial, Helvetica, sans-serif' >back_left</text><text x='150' y='256' font-size='15' fill='#1A1611' text-anchor='start' font-weight='normal' font-family='Arial, Helvetica, sans-serif' >=</text><rect x='170' y='238' width='57.699999999999996' height='25' rx='12.5' fill='#FF8A3D' stroke='none' stroke-width='0' /><text x='198.85' y='254' font-size='13' fill='white' text-anchor='middle' font-weight='bold' font-family='Arial, Helvetica, sans-serif' >drive</text><text x='240' y='256' font-size='18' fill='#1A1611' text-anchor='middle' font-weight='bold' font-family='Arial, Helvetica, sans-serif' >-</text><rect x='255' y='238' width='65.24' height='25' rx='12.5' fill='#3B82F6' stroke='none' stroke-width='0' /><text x='287.62' y='254' font-size='13' fill='white' text-anchor='middle' font-weight='bold' font-family='Arial, Helvetica, sans-serif' >strafe</text><text x='335' y='256' font-size='18' fill='#1A1611' text-anchor='middle' font-weight='bold' font-family='Arial, Helvetica, sans-serif' >+</text><rect x='350' y='238' width='50.16' height='25' rx='12.5' fill='#22C55E' stroke='none' stroke-width='0' /><text x='375.08' y='254' font-size='13' fill='white' text-anchor='middle' font-weight='bold' font-family='Arial, Helvetica, sans-serif' >turn</text><rect x='30' y='276' width='520' height='36' rx='8' fill='white' stroke='#E5E0D8' stroke-width='1.5' /><text x='40' y='302' font-size='15' fill='#1A1611' text-anchor='start' font-weight='bold' font-family='Arial, Helvetica, sans-serif' >back_right</text><text x='150' y='302' font-size='15' fill='#1A1611' text-anchor='start' font-weight='normal' font-family='Arial, Helvetica, sans-serif' >=</text><rect x='170' y='284' width='57.699999999999996' height='25' rx='12.5' fill='#FF8A3D' stroke='none' stroke-width='0' /><text x='198.85' y='300' font-size='13' fill='white' text-anchor='middle' font-weight='bold' font-family='Arial, Helvetica, sans-serif' >drive</text><text x='240' y='302' font-size='18' fill='#1A1611' text-anchor='middle' font-weight='bold' font-family='Arial, Helvetica, sans-serif' >+</text><rect x='255' y='284' width='65.24' height='25' rx='12.5' fill='#3B82F6' stroke='none' stroke-width='0' /><text x='287.62' y='300' font-size='13' fill='white' text-anchor='middle' font-weight='bold' font-family='Arial, Helvetica, sans-serif' >strafe</text><text x='335' y='302' font-size='18' fill='#1A1611' text-anchor='middle' font-weight='bold' font-family='Arial, Helvetica, sans-serif' >-</text><rect x='350' y='284' width='50.16' height='25' rx='12.5' fill='#22C55E' stroke='none' stroke-width='0' /><text x='375.08' y='300' font-size='13' fill='white' text-anchor='middle' font-weight='bold' font-family='Arial, Helvetica, sans-serif' >turn</text><text x='30' y='355' font-size='14' fill='#1A1611' text-anchor='start' font-weight='normal' font-family='Arial, Helvetica, sans-serif' >Try it: left stick straight up  -&gt;  drive = 1, strafe = 0, turn = 0  -&gt;  every wheel gets +1. Forward!</text><text x='30' y='378' font-size='14' fill='#1A1611' text-anchor='start' font-weight='normal' font-family='Arial, Helvetica, sans-serif' >Try it: left stick right  -&gt;  drive = 0, strafe = 1, turn = 0  -&gt;  FL +1, FR -1, BL -1, BR +1. Slide right!</text><text x='620' y='90' font-size='16' fill='#1A1611' text-anchor='start' font-weight='bold' font-family='Arial, Helvetica, sans-serif' >Too much? Shrink them all together.</text><text x='620' y='110' font-size='13' fill='#9CA3AF' text-anchor='start' font-weight='normal' font-family='Arial, Helvetica, sans-serif' >A motor can't go past 1.0 (100%).</text><line x1='620' y1='300' x2='930' y2='300' stroke='#1A1611' stroke-width='2' stroke-linecap='round' /><line x1='620' y1='160' x2='930' y2='160' stroke='#EF4444' stroke-width='1.5' stroke-linecap='round' stroke-dasharray='5 4'/><text x='935' y='164' font-size='12' fill='#EF4444' text-anchor='start' font-weight='normal' font-family='Arial, Helvetica, sans-serif' >1.0</text><rect x='630' y='160.0' width='24' height='140.0' rx='3' fill='#9CA3AF' stroke='none' stroke-width='0' /><rect x='660' y='200.0' width='24' height='100.0' rx='3' fill='#FF8A3D' stroke='none' stroke-width='0' /><text x='657' y='318' font-size='13' fill='#1A1611' text-anchor='middle' font-weight='bold' font-family='Arial, Helvetica, sans-serif' >FL</text><rect x='705' y='240.0' width='24' height='60.0' rx='3' fill='#9CA3AF' stroke='none' stroke-width='0' /><rect x='735' y='257.1428571428571' width='24' height='42.85714285714286' rx='3' fill='#FF8A3D' stroke='none' stroke-width='0' /><text x='732' y='318' font-size='13' fill='#1A1611' text-anchor='middle' font-weight='bold' font-family='Arial, Helvetica, sans-serif' >FR</text><rect x='780' y='200.0' width='24' height='100.0' rx='3' fill='#9CA3AF' stroke='none' stroke-width='0' /><rect x='810' y='228.57142857142856' width='24' height='71.42857142857143' rx='3' fill='#FF8A3D' stroke='none' stroke-width='0' /><text x='807' y='318' font-size='13' fill='#1A1611' text-anchor='middle' font-weight='bold' font-family='Arial, Helvetica, sans-serif' >BL</text><rect x='855' y='280.0' width='24' height='20.0' rx='3' fill='#9CA3AF' stroke='none' stroke-width='0' /><rect x='885' y='285.7142857142857' width='24' height='14.285714285714288' rx='3' fill='#FF8A3D' stroke='none' stroke-width='0' /><text x='882' y='318' font-size='13' fill='#1A1611' text-anchor='middle' font-weight='bold' font-family='Arial, Helvetica, sans-serif' >BR</text><text x='775' y='345' font-size='12' fill='#9CA3AF' text-anchor='middle' font-weight='normal' font-family='Arial, Helvetica, sans-serif' >grey = before, orange = after dividing everything by 1.4</text><text x='775' y='365' font-size='12' fill='#9CA3AF' text-anchor='middle' font-weight='normal' font-family='Arial, Helvetica, sans-serif' >The shape stays the same, so the robot still moves the right way.</text><rect x='30' y='400' width='900' height='46' rx='10' fill='#F3EFE7' stroke='none' stroke-width='0' /><text x='480' y='428' font-size='14' fill='#1A1611' text-anchor='middle' font-weight='normal' font-family='Arial, Helvetica, sans-serif' >That's the whole drive program: read, mix, shrink if needed, send. Everything else is comments!</text></svg>