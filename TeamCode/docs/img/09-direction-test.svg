<svg xmlns='http://www.w3.org/2000/svg' width='960' height='400' viewBox='0 0 960 400'><rect x='1' y='1' width='958' height='398' rx='18' fill='#FFFDF7' stroke='#E5E0D8' stroke-width='2'/><text x='480.0' y='42' font-size='26' fill='#1A1611' text-anchor='middle' font-weight='bold' font-family='Arial, Helvetica, sans-serif' >Testing motor directions (do this after any rebuild)</text><rect x='80' y='250' width='260' height='40' rx='4' fill='#d9d9d9' stroke='#1A1611' stroke-width='2' /><circle cx='100' cy='275' r='34' fill='#2b2b2b' stroke='#1A1611' stroke-width='2'/><circle cx='100' cy='275' r='12' fill='#F5C518' stroke='none' stroke-width='2'/><circle cx='280' cy='275' r='34' fill='#2b2b2b' stroke='#1A1611' stroke-width='2'/><circle cx='280' cy='275' r='12' fill='#F5C518' stroke='none' stroke-width='2'/><rect x='150' y='290' width='80' height='40' rx='4' fill='#c19a6b' stroke='#1A1611' stroke-width='2' /><text x='190' y='315' font-size='12' fill='white' text-anchor='middle' font-weight='bold' font-family='Arial, Helvetica, sans-serif' >block</text><line x1='40' y1='330' x2='380' y2='330' stroke='#1A1611' stroke-width='3' stroke-linecap='round' /><text x='210' y='355' font-size='14' fill='#1A1611' text-anchor='middle' font-weight='bold' font-family='Arial, Helvetica, sans-serif' >Wheels in the air = safe to test</text><line x1='60' y1='275' x2='60.0' y2='244.6' stroke='#22C55E' stroke-width='4' stroke-linecap='round' /><polygon points='60.0,235.0 65.8,245.5 54.2,245.5' fill='#22C55E'/><text x='60' y='225' font-size='12' fill='#22C55E' text-anchor='middle' font-weight='bold' font-family='Arial, Helvetica, sans-serif' >spin?</text><text x='420' y='100' font-size='15' fill='#1A1611' text-anchor='start' font-weight='normal' font-family='Arial, Helvetica, sans-serif' >1. Put the robot on a block so no wheel touches the floor.</text><text x='420' y='128' font-size='15' fill='#1A1611' text-anchor='start' font-weight='normal' font-family='Arial, Helvetica, sans-serif' >2. INIT and START the Strafer TeleOp.</text><text x='420' y='156' font-size='15' fill='#1A1611' text-anchor='start' font-weight='normal' font-family='Arial, Helvetica, sans-serif' >3. Push the LEFT stick straight forward and hold it.</text><text x='420' y='184' font-size='15' fill='#1A1611' text-anchor='start' font-weight='normal' font-family='Arial, Helvetica, sans-serif' >4. Look at each wheel. Would it roll the robot FORWARD?</text><text x='420' y='212' font-size='15' fill='#1A1611' text-anchor='start' font-weight='normal' font-family='Arial, Helvetica, sans-serif' >5. Wrong way? Swap FORWARD &lt;-&gt; REVERSE for THAT motor only</text><text x='420' y='240' font-size='15' fill='#1A1611' text-anchor='start' font-weight='normal' font-family='Arial, Helvetica, sans-serif' >     (in StraferTeleOp.java), then rebuild and test again.</text><text x='420' y='268' font-size='15' fill='#1A1611' text-anchor='start' font-weight='normal' font-family='Arial, Helvetica, sans-serif' >6. All four correct? Put it on the floor and drive!</text><rect x='420' y='300' width='500' height='70' rx='10' fill='#FFF1E6' stroke='#FF8A3D' stroke-width='2' /><text x='670' y='325.0' font-size='14' fill='#1A1611' text-anchor='middle' font-weight='bold' font-family='Arial, Helvetica, sans-serif' >Our robot needed: front_left FORWARD, back_left REVERSE,</text><text x='670' y='343.9' font-size='14' fill='#1A1611' text-anchor='middle' font-weight='bold' font-family='Arial, Helvetica, sans-serif' >front_right FORWARD, back_right FORWARD.</text></svg>