' stroke='none' stroke-width='0' /><text x='550' y='596' font-size='11' fill='#1A1611' text-anchor='middle' font-weight='normal' font-family='Arial, Helvetica, sans-serif' >Why: a 17 in chassis leaves 25 mm in front inside the 18 in cube, too little for any fixed intake ahead of the frame. Removing the front cross bar</text><text x='550' y='614' font-size='11' fill='#1A1611' text-anchor='middle' font-weight='normal' font-family='Arial, Helvetica, sans-serif' >opens a 264 mm bay between the rails. The ball rolls in on the tiles, the flapper catches it inside, and pushes it onto a ramp that starts behind the sweep.</text></svg>