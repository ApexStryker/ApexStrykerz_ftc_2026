rif' >NeveRest 19.2</text><line x1='735' y1='420' x2='775' y2='210' stroke='#FF8A3D' stroke-width='1.5' stroke-linecap='round' /><rect x='800' y='420' width='110' height='48' rx='8' fill='#FF8A3D' stroke='#1A1611' stroke-width='2' /><text x='855.0' y='442' font-size='13' fill='#1A1611' text-anchor='middle' font-weight='bold' font-family='Arial, Helvetica, sans-serif' >Flywheel</text><text x='855.0' y='460' font-size='11' fill='#1A1611' text-anchor='middle' font-weight='normal' font-family='Arial, Helvetica, sans-serif' >HD Hex bare</text><line x1='855' y1='420' x2='775' y2='210' stroke='#FF8A3D' stroke-width='1.5' stroke-linecap='round' /><rect x='40' y='420' width='200' height='90' rx='8' fill='#e8f4ff' stroke='#1A1611' stroke-width='2' /><text x='140.0' y='442' font-size='13' fill='#1A1611' text-anchor='middle' font-weight='bold' font-family='Arial, Helvetica, sans-serif' >Driver Hub</text><text x='140.0' y='460' font-size='11' fill='#1A1611' text-anchor='middle' font-weight='normal' font-family='Arial, Helvetica, sans-serif' >REV-31-1596 + 2 gamepads</text><path d='M261.6,453.6 A12,12 0 0 1 278.4,453.6' fill='none' stroke='#3B82F6' stroke-width='2.5' stroke-linecap='round' stroke-linejoin='round' /><path d='M254.6,446.6 A22,22 0 0 1 285.4,446.6' fill='none' stroke='#3B82F6' stroke-width='2.5' stroke-linecap='round' stroke-linejoin='round' /><path d='M247.6,439.6 A32,32 0 0 1 292.4,439.6' fill='none' stroke='#3B82F6' stroke-width='2.5' stroke-linecap='round' stroke-linejoin='round' /><text x='270' y='500' font-size='11' fill='#3B82F6' text-anchor='middle' font-weight='normal' font-family='Arial, Helvetica, sans-serif' >Wi-Fi to Control Hub</text><rect x='40' y='540' width='920' height='80' rx='10' fill='#F3EFE7' stroke='none' stroke-width='0' /><text x='60' y='562' font-size='12' fill='#1A1611' text-anchor='start' font-weight='normal' font-family='Arial, Helvetica, sans-serif' >Wire gauge (R609): 18 AWG battery and hub power, 22 AWG motor leads, 28 AWG sensor/encoder. Red/yellow/white = +, black/blue = - on the 12 V bus (R610).</text><text x='60' y='581' font-size='12' fill='#1A1611' text-anchor='start' font-weight='normal' font-family='Arial, Helvetica, sans-serif' >Hub LEDs and fuses must be visible at inspection (R606). Name devices &lt;team&gt;-RC / &lt;team&gt;-DS (R705). Change the Control Hub Wi-Fi password (R711).</text><text x='60' y='600' font-size='12' fill='#1A1611' text-anchor='start' font-weight='normal' font-family='Arial, Helvetica, sans-serif' >Max 2 motors per motor port, 2 servos per servo port (R505). Total on robot: 7 motors, 1 servo, so 1 motor and 7 servos in reserve.</text></svg>